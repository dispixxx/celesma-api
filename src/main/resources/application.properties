spring.application.name=celesma-api
server.port=8080

# DataSource
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/celesma_db2
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=dev-secret-key-at-least-32-characters-long-enough
app.jwt.expiration-ms=86400000

# OAuth2 Google
spring.security.oauth2.client.registration.google.client-id=dev-client-id
spring.security.oauth2.client.registration.google.client-secret=dev-client-secret
spring.security.oauth2.client.registration.google.scope=email,profile

ai.api.url=https://api.deepseek.com/v1/chat/completions
ai.api.key=${DEEPSEEK_API_KEY}
